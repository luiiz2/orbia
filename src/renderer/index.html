<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Orbia</title>
    <link rel="icon" type="image/png" href="/src/assets/icon.png" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media: blob:"
    />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('orbia_theme') || 'dark';
          var isLight = theme === 'light' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          var root = document.documentElement;
          if (isLight) {
            root.classList.add('light');
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
