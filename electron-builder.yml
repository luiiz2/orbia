appId: com.orbia.app
productName: Orbia
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CONTRIBUTING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/mupdf/**'
win:
  executableName: orbia
  icon: build/icon.ico
  signExecutable: false
  forceCodeSigning: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Orbia
  uninstallDisplayName: Orbia
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: orbia.app
  category: Education
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
